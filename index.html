<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eierman</title>
  <meta name="description" content="Felix aka eierman: IT, e-scooter tuning and the small tools that come out of it.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,700;1,400&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=17" id="home-css">
  <style>
    html.version-loading body { visibility: hidden; }
    *, *::before, *::after { box-sizing: border-box; }
    .pfp-slot { position: relative; }
    .pfp-slot > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .pfp-slot.has-pfp { color: transparent; }
  </style>
  <script>
    // eierman.cc used to answer with a permanent (301) redirect to fakecrime.bio, and
    // browsers that saw it keep it cached and never ask this server for "/" again.
    // Whoever gets here anyway (any URL, with or without a query) fetches "/" fresh
    // from the network, which overwrites that cached redirect with this page.
    // Afterwards a query like "?=0" (from the fakecrime redirect) is removed from the URL.
    window.addEventListener('load', function () {
      function dropQuery() {
        if (location.search && window.history && history.replaceState) {
          history.replaceState(history.state, '', location.pathname + location.hash);
        }
      }
      if (!window.fetch || !window.Promise) { dropQuery(); return; }
      var urls = [location.origin + '/'];
      if (location.protocol === 'http:') urls.push('https://' + location.host + '/');
      Promise.all(urls.map(function (url) {
        var same = url.indexOf(location.origin + '/') === 0;
        return fetch(url, { cache: 'reload', mode: same ? 'same-origin' : 'no-cors', credentials: 'omit' }).catch(function () {});
      })).then(dropQuery);
    });
  </script>
  <script>
    // Hide the page until content.json is loaded and rendered (app.js shows it again).
    document.documentElement.classList.add('version-loading');
    if (/^#(tiktok|youtube|github|steam|soundcloud|anilist|faceit|discord)$/i.test(location.hash) ||
        (!location.hash && /(tiktok|youtube|youtu\.be|github|steamcommunity|steampowered|soundcloud|anilist|faceit|discord)/i.test(document.referrer))) {
      document.documentElement.classList.add('version-loading');
    }
  </script>
  <script>
    // Palettes: [bg, surface, text, muted, accent, line]
    window.PALETTES = {
      Night:  { dark: ['#15122b', '#201b3d', '#eee8ff', '#a79fcb', '#f472d0', '#342d5c'],
                light: ['#e9e0ff', '#d9cbfb', '#1c1633', '#4b4176', '#9c1585', '#c3b2f0'] },
      Matcha: { dark: ['#0f1a14', '#18271e', '#e6f2ea', '#9bb5a5', '#7ee0a1', '#284034'],
                light: ['#dbefe0', '#c6e3cd', '#0f2418', '#3a5845', '#156b3c', '#acd1b6'] },
      Sunset: { dark: ['#1f1216', '#2c1a20', '#fbe9ea', '#c9a2a8', '#ff8a65', '#42282f'],
                light: ['#ffe2d6', '#fccdbb', '#2a1418', '#6a3e45', '#a8360a', '#f0b59d'] },
      Neon:   { dark: ['#0c1620', '#13222f', '#e3f1fa', '#92adc0', '#f5e14b', '#1f3446'],
                light: ['#d8ebff', '#c2ddf7', '#0d1b28', '#3c566b', '#0a5d99', '#a8c9e6'] },
      Amber:  { dark: ['#17140f', '#221e17', '#f3ecdf', '#b3a68f', '#ffb648', '#362f24'],
                light: ['#fae8c4', '#f3d7a4', '#221c12', '#5b4c32', '#8f4c00', '#e3c993'] }
    };
    window.applyTheme = function (name, mode) {
      var keys = ['bg', 'surface', 'text', 'muted', 'accent', 'line'];
      var values = window.PALETTES[name][mode];
      var root = document.documentElement;
      keys.forEach(function (k, i) { root.style.setProperty('--' + k, values[i]); });
      root.dataset.palette = name;
      root.dataset.theme = mode;
      root.style.colorScheme = mode;
    };
    (function () {
      var names = Object.keys(window.PALETTES);
      var saved = null;
      try { saved = localStorage.getItem('eierman-mode'); } catch (e) {}
      var mode = saved === 'light' || saved === 'dark' ? saved
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      window.applyTheme(names[Math.floor(Math.random() * names.length)], mode);
    })();
  </script>
</head>
<body>
  <a class="skip" href="#projects">Skip to projects</a>

  <header class="hero">
    <div class="wrap">
      <div class="controls">
        <span class="home-pfp pfp-slot" data-pfp="github" aria-hidden="true">e</span>
        <button type="button" id="palette-btn"><span class="swatch" aria-hidden="true"></span><span id="palette-name">Colours</span></button>
        <button type="button" id="mode-btn">Switch to light</button>
        <span class="sr-only" aria-live="polite" id="theme-status"></span>
      </div>
      <div class="nameplate">
        <h1 id="home-name">eierman</h1>
        <img class="cat" src="assets/oneko_sleep.gif" width="64" height="64" alt="" data-run="assets/oneko_run.gif" data-sleep="assets/oneko_sleep.gif">
      </div>
      <p class="intro" id="home-intro"></p>
      <nav class="links" aria-label="Elsewhere" id="home-links"></nav>
    </div>
  </header>

  <main>
    <section id="projects" class="wrap">
      <h2>Projects</h2>
      <div id="project-groups"><p class="empty">Loading projects…</p></div>
    </section>

    <section id="about" class="wrap">
      <h2>Besides code</h2>
      <dl class="facts" id="home-facts"></dl>

      <ul class="covers" aria-label="Some favourite anime" id="home-covers"></ul>
      <p class="more" id="home-more"></p>
    </section>
  </main>

  <footer class="wrap">
    <p id="home-contact"></p>
    <p class="small">Cat from <a href="https://github.com/adryd325/oneko.js">oneko.js</a> (MIT).</p>
    <div id="versions-slot"></div>
  </footer>

  <script src="site.js?v=27"></script>
  <script src="profiles.js?v=12"></script>
  <script src="app.js?v=30"></script>

  <script>
    (function () {
      var root = document.documentElement;
      var names = Object.keys(window.PALETTES);
      var paletteBtn = document.getElementById('palette-btn');
      var paletteName = document.getElementById('palette-name');
      var modeBtn = document.getElementById('mode-btn');
      var status = document.getElementById('theme-status');

      function render() {
        var mode = root.dataset.theme;
        paletteName.textContent = root.dataset.palette;
        paletteBtn.setAttribute('aria-label', 'Colour palette: ' + root.dataset.palette + '. Switch to other colours');
        modeBtn.textContent = mode === 'dark' ? 'Switch to light' : 'Switch to dark';
      }

      paletteBtn.addEventListener('click', function () {
        var i = names.indexOf(root.dataset.palette);
        var next = names[(i + 1) % names.length];
        window.applyTheme(next, root.dataset.theme);
        render();
        status.textContent = 'Colours: ' + next;
      });

      modeBtn.addEventListener('click', function () {
        var mode = root.dataset.theme === 'dark' ? 'light' : 'dark';
        window.applyTheme(root.dataset.palette, mode);
        try { localStorage.setItem('eierman-mode', mode); } catch (e) {}
        render();
        status.textContent = mode === 'dark' ? 'Dark colours on' : 'Light colours on';
      });

      render();
    })();

    (function () {
      var cat = document.querySelector('.cat');
      if (!cat || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      cat.src = cat.dataset.run;
      cat.classList.add('running');
      cat.addEventListener('animationend', function () {
        cat.src = cat.dataset.sleep;
        cat.classList.remove('running');
      }, { once: true });
    })();
  </script>
</body>
</html>
