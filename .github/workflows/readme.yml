name: Update profile README

# Rebuilds README.md and assets/terminal.svg from the GitHub version of eierman.cc.
# Runs daily (for new GitHub data), by hand, and when the website branch changes
# (started by .github/workflows/readme-trigger.yml on that branch).
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/github_readme.py"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: website
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/github_readme.py
        env:
          SITE_DIR: site
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add -A -- README.md assets/terminal.svg assets/readme
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile README from eierman.cc"
          git pull --rebase
          git push
